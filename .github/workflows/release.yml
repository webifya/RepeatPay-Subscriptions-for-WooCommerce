name: Build WordPress.org release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Read and validate version
        id: version
        shell: bash
        run: |
          version="$(sed -n "s/^[[:space:]]*\* Version: \([0-9.]*\)$/\1/p" webifya-subscriptions.php | head -n 1)"
          stable_tag="$(sed -n 's/^Stable tag: \([0-9.]*\)$/\1/p' readme.txt | head -n 1)"
          constant="$(sed -n "s/^define( 'WFS_VERSION', '\([0-9.]*\)' );$/\1/p" webifya-subscriptions.php | head -n 1)"
          test -n "$version"
          test "$version" = "$stable_tag"
          test "$version" = "$constant"
          if [[ "$GITHUB_REF_TYPE" = "tag" ]]; then
            test "$GITHUB_REF_NAME" = "v$version"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build clean plugin ZIP
        shell: bash
        run: |
          slug='subscribely-recurring-billing-for-woocommerce'
          package_root="$RUNNER_TEMP/package"
          plugin_dir="$package_root/$slug"
          mkdir -p "$plugin_dir/includes" dist
          cp LICENSE readme.txt webifya-subscriptions.php "$plugin_dir/"
          cp includes/*.php "$plugin_dir/includes/"
          (
            cd "$package_root"
            zip -qr "$GITHUB_WORKSPACE/dist/$slug-${{ steps.version.outputs.version }}.zip" "$slug"
          )

      - name: Verify submission contents
        shell: bash
        run: |
          archive="dist/subscribely-recurring-billing-for-woocommerce-${{ steps.version.outputs.version }}.zip"
          unzip -t "$archive"
          entries="$(unzip -Z1 "$archive")"
          if printf '%s\n' "$entries" | grep -Eq '(^|/)(\.(git|github|gitignore|wordpress-org)|ROADMAP\.md)($|/)'; then
            echo 'Development or hidden files were found in the release ZIP.' >&2
            exit 1
          fi
          test "$(unzip -p "$archive" '*/webifya-subscriptions.php' | sed -n "s/^[[:space:]]*\* Version: \([0-9.]*\)$/\1/p" | head -n 1)" = "${{ steps.version.outputs.version }}"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: subscribely-wordpress-org-${{ steps.version.outputs.version }}
          path: dist/*.zip
          if-no-files-found: error

      - name: Attach ZIP to a draft GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --draft --title "Subscribely ${{ steps.version.outputs.version }}" --generate-notes
          fi
          gh release upload "$GITHUB_REF_NAME" dist/*.zip --clobber
